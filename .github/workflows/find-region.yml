name: Find Pooler Region

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/find-pooler-region.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}